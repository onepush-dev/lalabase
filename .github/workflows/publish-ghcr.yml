name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Dockerfile", "railway/**", "postgres/**", "valkey/**", ".github/workflows/publish-ghcr.yml"]
concurrency:
  group: ghcr
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            image: ghcr.io/onepush-dev/lalabase:2026.11.0
          - context: postgres
            image: ghcr.io/onepush-dev/lalabase-postgres:17
          - context: valkey
            image: ghcr.io/onepush-dev/lalabase-valkey:8
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}
          platforms: linux/amd64
          labels: org.opencontainers.image.source=https://github.com/onepush-dev/lalabase
